name: ci
# Проверки, колёса и sdist — по тегу v* и вручную. Тег v<версия> — GitHub Release.
# Ручной запуск: publish=testpypi — TestPyPI (любая ветка), publish=pypi — PyPI (только от тега v*).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Куда выложить пакеты (pypi — только от тега v*)"
        type: choice
        options: [none, testpypi, pypi]
        default: none

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p shmobj-core

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]  # 3.11 — снятие регистрации в resource_tracker, 3.14 — track=False
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install maturin pytest hypothesis xxhash pydevd-pycharm
      - run: pytest reference/
      - run: maturin build --release -o dist && pip install --no-index --find-links dist shmobj
      - run: pytest

  # Тег v<версия>: коммит из master, версия совпадает с crates/shmobj-py/Cargo.toml. Без этого ни release, ни pypi:
  # версию на PyPI нельзя перезаписать, удалённый номер нельзя использовать повторно.
  version:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # история и ветки — для проверки принадлежности master
      - name: Тег на коммите из master
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "publish=pypi — только запуск от тега v*, сейчас $GITHUB_REF"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "коммит тега $GITHUB_REF_NAME не входит в master"; exit 1; }
      - name: Версия тега и пакета
        run: |
          version=$(grep -m1 '^version' crates/shmobj-py/Cargo.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "тег $GITHUB_REF_NAME, версия пакета $version"; exit 1; }

  wheels:
    needs: [rust, python]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }  # кросс-сборка на arm-раннере; без колеса pip на Intel требует Rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -o dist
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.os }}-${{ matrix.target }}", path: dist }

  sdist:
    needs: [rust, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist }

  # Push тега v<версия> — колёса и sdist в GitHub Release.
  # Релиз, созданный в интерфейсе вместе с тегом, получает файлы; без него релиз создаётся.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Релиз
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
        env: { GH_TOKEN: "${{ github.token }}" }

  # Trusted Publishing (OIDC): издатель на pypi.org / test.pypi.org привязан к ci.yml и окружению; токенов нет.
  # gh-action-pypi-publish проверяет метаданные (twine check) и прикладывает аттестации (PEP 740).
  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
