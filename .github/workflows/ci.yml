name: ci
# Только вручную и по тегу: репозиторий приватный, минуты Actions платные сверх квоты (macOS ×10, Windows ×2).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # ручной запуск: проверки, колёса и sdist без релиза

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p shmobj-core

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]  # 3.11 — снятие регистрации в resource_tracker, 3.14 — track=False
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install maturin pytest hypothesis xxhash pydevd-pycharm
      - run: pytest reference/
      - run: maturin build --release -o dist && pip install --no-index --find-links dist shmobj
      - run: pytest

  wheels:
    needs: [rust, python]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -o dist
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.os }}-${{ matrix.target }}", path: dist }

  sdist:
    needs: [rust, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist }

  # Тег v<версия> — колёса и sdist в GitHub Release; версия тега должна совпадать с crates/shmobj-py/Cargo.toml.
  # Релиз, созданный в интерфейсе вместе с тегом, получает файлы; без него релиз создаётся.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Версия тега и пакета
        run: |
          version=$(grep -m1 '^version' crates/shmobj-py/Cargo.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "тег $GITHUB_REF_NAME, версия пакета $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Релиз
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
        env: { GH_TOKEN: "${{ github.token }}" }
