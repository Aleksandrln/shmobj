[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "shmobj"
requires-python = ">=3.11"
dynamic = ["version"]
description = "Zero-copy shared-memory dict/list structures for Python multiprocessing: share data and publish updates between processes (pub/sub, asyncio; Rust core)"
readme = "README.en.md"
keywords = [
    "shared-memory",
    "multiprocessing",
    "ipc",
    "inter-process-communication",
    "pubsub",
    "message-passing",
    "asyncio",
    "mmap",
    "zero-copy",
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "AleksandrLn" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Aleksandrln/shmobj"
Repository = "https://github.com/Aleksandrln/shmobj"
Changelog = "https://github.com/Aleksandrln/shmobj/releases"
Issues = "https://github.com/Aleksandrln/shmobj/issues"
Author = "https://github.com/Aleksandrln"

[project.optional-dependencies]
test = ["pytest", "hypothesis", "xxhash", "pydevd-pycharm"]

[tool.maturin]
manifest-path = "crates/shmobj-py/Cargo.toml"
python-source = "python"
module-name = "shmobj._core"
python-packages = ["pydevd_plugins"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
