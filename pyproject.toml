[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "shmobj"
requires-python = ">=3.11"
dynamic = ["version"]
description = "Read-only dict/list/scalars in shared memory without deserialization"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "AleksandrLn" }]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[project.urls]
Homepage = "https://github.com/Aleksandrln/shmobj"
Issues = "https://github.com/Aleksandrln/shmobj/issues"
Author = "https://github.com/Aleksandrln"

[project.optional-dependencies]
test = ["pytest", "hypothesis", "pytest-benchmark", "xxhash", "pydevd-pycharm"]

[tool.maturin]
manifest-path = "crates/shmobj-py/Cargo.toml"
python-source = "python"
module-name = "shmobj._core"
python-packages = ["pydevd_plugins"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
